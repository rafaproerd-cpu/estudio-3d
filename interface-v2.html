
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estúdio 3D</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#10131b;color:#f5f7ff;font-family:Arial,sans-serif}
header{height:58px;background:#191f2c;border-bottom:1px solid #30394c;display:flex;align-items:center;justify-content:space-between;padding:0 15px}
header strong{font-size:19px;color:#83aaff}
header button,.toolbar button,.actions button,.section button{
background:#29344a;color:white;border:1px solid #43516b;border-radius:8px;padding:10px;cursor:pointer
}
button:active{opacity:.7}
.layout{display:grid;grid-template-columns:190px 1fr 210px;height:calc(100vh - 58px)}
aside{background:#171d29;padding:12px;overflow:auto;border-right:1px solid #30394c}
.right{border-right:0;border-left:1px solid #30394c}
h3{font-size:13px;color:#91a9d4;text-transform:uppercase;margin:8px 0 12px}
.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.toolbar button{font-size:12px}
button.active{background:#4169e1;border-color:#83aaff}
.section{border-top:1px solid #30394c;padding:12px 0}
label{display:block;font-size:12px;color:#c1cbe0;margin:9px 0 5px}
input,select{width:100%;padding:8px;background:#242d3e;color:white;border:1px solid #43516b;border-radius:6px}
input[type=color]{height:38px;padding:3px}
input[type=range]{padding:0}
#viewport{position:relative;min-width:0;background:#10131b}
#scene{width:100%;height:100%;display:block;touch-action:none}
#hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:#20283acc;padding:9px 13px;border-radius:20px;font-size:11px;white-space:nowrap;pointer-events:none}
#status{font-size:11px;color:#8fa2c5;margin-top:10px;line-height:1.5}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.actions button{font-size:12px}
#objectList button{display:block;width:100%;text-align:left;margin:5px 0}
footer{font-size:10px;color:#8090ad;margin-top:15px;line-height:1.5}
#animate,#pauseAnimation{width:100%;margin-top:6px}
@media(max-width:700px){
.layout{grid-template-columns:115px minmax(0,1fr);height:calc(100vh - 58px)}
aside{padding:8px}
.right{grid-column:1/3;grid-row:2;border:0;border-top:1px solid #30394c;display:grid;grid-template-columns:1fr 1fr;gap:10px;max-height:240px}
#viewport{grid-column:2;grid-row:1}
.toolbar{grid-template-columns:1fr}
.toolbar button{padding:9px 4px;font-size:11px}
h3{font-size:11px}
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>
<header>
<strong>✦ ESTÚDIO 3D</strong>
<button id="reset">Nova cena</button>
</header>

<div class="layout">

<aside>
<h3>Adicionar objetos</h3>
<div class="toolbar">
<button id="box">＋ Cubo</button>
<button id="sphere">＋ Esfera</button>
<button id="cylinder">＋ Cilindro</button>
<button id="torus">＋ Anel</button>
</div>

<div class="section">
<h3>Ferramentas</h3>
<div class="toolbar">
<button id="move" class="active">Mover</button>
<button id="rotate">Girar</button>
<button id="scale">Tamanho</button>
</div>
</div>

<div class="section">
<h3>Objetos da cena</h3>
<div id="objectList"></div>
</div>
</aside>

<main id="viewport">
<canvas id="scene"></canvas>
<div id="hint">Personagem 3D • Arraste para girar a câmera</div>
</main>

<aside class="right">

<div class="section">
<h3>Cadastro universal</h3>
<label>Nome do personagem</label>
<input id="characterName" type="text" maxlength="80" placeholder="Ex.: Guardião da floresta">
<label>Categoria</label>
<select id="characterCategory">
<option value="human">Humano</option><option value="animal">Animal</option><option value="creature">Criatura / Monstro</option><option value="robot">Robô</option><option value="alien">Alienígena</option><option value="object">Objeto antropomórfico</option><option value="other">Outro</option>
</select>
<label>Fase da vida</label>
<select id="characterAge">
<option value="baby">Bebê</option><option value="child">Criança</option><option value="teen">Adolescente</option><option value="adult">Adulto</option><option value="senior">Idoso</option><option value="not_applicable">Não se aplica</option>
</select>
<label>Tipo de estrutura (rig)</label>
<select id="characterRig">
<option value="humanoid">Humanoide</option><option value="quadruped">Quadrúpede</option><option value="avian">Ave</option><option value="custom">Personalizado</option><option value="none">Sem rig</option><option value="unknown">A definir</option>
</select>
<label>Estilo visual</label>
<select id="characterStyle">
<option value="definido pelo contexto">Definido pelo contexto</option><option value="cartoon">Cartoon</option><option value="cartoon realista">Cartoon realista</option><option value="3D estilizado semi-realista">3D estilizado semi-realista</option><option value="realista">Realista</option><option value="fantasia">Fantasia</option><option value="anime">Anime</option>
</select>
<label>Descrição</label>
<input id="characterDescription" type="text" maxlength="300" placeholder="Descreva o personagem">
<button id="saveCharacterData" style="width:100%;margin-top:10px">Salvar cadastro</button>
<button id="generateCharacter3D" style="width:100%;margin-top:8px">✦ Gerar protótipo 3D</button>
<button id="newCharacterRecord" style="width:100%;margin-top:8px">＋ Novo personagem no catálogo</button>
<div style="margin-top:12px">
<label>Catálogo de personagens</label>
<div id="characterCatalog" style="display:grid;gap:6px"></div>
</div>
</div>

<div>
<h3>Aparência</h3>
<label>Cor principal</label>
<input type="color" id="color" value="#527cff">
<label>Cor dos detalhes</label>
<input type="color" id="accentColor" value="#26344f">

<label>Escala</label>
<input type="range" id="size" min="0.3" max="3" step="0.1" value="1">

<label>Posição horizontal</label>
<input type="range" id="position" min="-4" max="4" step="0.1" value="0">

<label>Rotação</label>
<input type="range" id="rotation" min="0" max="360" value="0">
</div>

<div>
<h3>Iluminação e cenário</h3>
<label>Intensidade da luz</label>
<input type="range" id="light" min="0" max="5" step="0.1" value="2">

<label>Fundo</label>
<select id="background">
<option value="#10131b">Escuro</option>
<option value="#26344f">Azul</option>
<option value="#555555">Cinza</option>
<option value="#eeeeee">Claro</option>
<option value="#183b32">Verde</option>
</select>

<div class="section">
<h3>Animação do personagem</h3>
<label>Movimento disponível</label>
<select id="animationSelect" disabled>
<option>Carregando personagem...</option>
</select>
<button id="animate" disabled>▶ Iniciar animação</button>
<button id="pauseAnimation" disabled>Ⅱ Pausar animação</button>
</div>

<div class="section">
<h3>Projeto</h3>
<div class="actions">
<button id="export">Exportar JSON</button>
<button id="exportBundle">Exportar projeto completo (.zip)</button>
<button id="importBundle">Importar projeto completo (.zip)</button>
<button id="exportGLB">Exportar personagem GLB</button>
<button id="importGLB">Importar GLB (substituir)</button>
<button id="addGLB">＋ Adicionar GLB à cena</button>
<button id="import">Importar JSON</button>
<button id="delete">Excluir objeto</button>
</div>
<input type="file" id="file" accept=".json,application/json" hidden>
<input type="file" id="bundleFile" accept=".zip,application/zip,application/x-zip-compressed" hidden>
<input type="file" id="glbFile" accept=".glb,model/gltf-binary" hidden>
</div>

<div id="status">Preparando o Estúdio 3D...</div>
<footer>
Estúdio 3D • Interface V2<br>
Carregamento de personagem GLB.
</footer>
</div>
</aside>
</div>

<script src="./estudio-core.js"></script>
<script src="./character-system.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

const canvas=document.querySelector('#scene');

const renderer=new THREE.WebGLRenderer({
canvas,
antialias:true,
alpha:false
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.outputColorSpace=THREE.SRGBColorSpace;

const scene=new THREE.Scene();
scene.background=new THREE.Color('#10131b');

const camera=new THREE.PerspectiveCamera(45,1,.1,100);
camera.position.set(4,2.5,7);
camera.lookAt(0,0,0);

scene.add(new THREE.HemisphereLight(0xffffff,0x30364c,2));

const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(5,8,5);
sun.castShadow=true;
scene.add(sun);

const floor=new THREE.Mesh(
new THREE.PlaneGeometry(30,30),
new THREE.MeshStandardMaterial({
color:0x252c3d,
roughness:.9
})
);

floor.rotation.x=-Math.PI/2;
floor.position.y=-1.6;
floor.receiveShadow=true;
scene.add(floor);

const grid=new THREE.GridHelper(30,30,0x63749b,0x39435b);
grid.position.y=-1.59;
scene.add(grid);

const objects=[];
let selected=null;
let mode='move';
let cameraSpin=0;
let dragging=false;
let lastX=0,lastY=0;

let character=null;
let characterRecordId=null;
let selectedCatalogRecordId=null;
let pendingCharacterImport=null;
let lastProjectImportSucceeded = false;
let projectImportRevision = 0;
// Mantém em memória os binários GLB importados para incluí-los no pacote portátil.
const externalModelAssets = new Map();
let mixer=null;
let animationActions=[];
let activeAction=null;
// Cada personagem GLB mantém seu próprio mixer e conjunto de clipes.
const characterAnimationStates = new Map();
let clock=new THREE.Clock();

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();

function status(message){
document.querySelector('#status').textContent=message;
}

function registerCharacterAnimations(root, clips) {
  const list = Array.isArray(clips) ? clips.slice() : [];
  const state = list.length
    ? { mixer: new THREE.AnimationMixer(root), clips: list, activeAction: null }
    : { mixer: null, clips: [], activeAction: null };
  characterAnimationStates.set(root, state);
  return state;
}

function activateCharacterAnimations(root) {
  const state = root ? characterAnimationStates.get(root) : null;
  mixer = state ? state.mixer : null;
  animationActions = state ? state.clips : [];
  activeAction = state ? state.activeAction : null;
  const select = document.querySelector('#animationSelect');
  select.innerHTML = '';
  if (animationActions.length) {
    animationActions.forEach((clip, index) => {
      const option = document.createElement('option');
      option.value = index;
      option.textContent = clip.name || 'Animação ' + (index + 1);
      select.appendChild(option);
    });
    select.disabled = false;
    document.querySelector('#animate').disabled = false;
    document.querySelector('#pauseAnimation').disabled = false;
  } else {
    select.innerHTML = '<option>Sem animações neste personagem</option>';
    select.disabled = true;
    document.querySelector('#animate').disabled = true;
    document.querySelector('#pauseAnimation').disabled = true;
  }
  document.querySelector('#pauseAnimation').textContent =
    mixer && mixer.timeScale === 0 ? '▶ Continuar animação' : 'Ⅱ Pausar animação';
}

/* PERSISTÊNCIA DA CENA NO NAVEGADOR */

function persistEditorState() {
  const core = window.Estudio3DCore;
  if (!core) return { ok: false, message: 'Núcleo do projeto indisponível.' };
  const project = core.getProject();
  const activeCharacter = character && character.userData.isCharacter && characterRecordId
    ? { id: characterRecordId, transform: {
        position: character.position.toArray(),
        rotation: character.rotation.toArray(),
        scale: character.scale.toArray()
      } }
    : null;
  const editorState = {
    hasCharacter: !!activeCharacter,
    background: '#' + scene.background.getHexString(),
    light: sun.intensity,
    activeCharacter,
    sceneCharacters: objects.filter(obj => obj.userData.isCharacter).map(obj => ({
      recordId: obj.userData.characterRecordId || (obj === character ? characterRecordId : null),
      active: obj === character,
      source: obj.userData.proceduralCategory ? 'procedural_preview' : 'external_file',
      transform: {
        position: obj.position.toArray(),
        rotation: obj.rotation.toArray(),
        scale: obj.scale.toArray()
      }
    })),
    objects: objects.filter(obj => !obj.userData.isCharacter).map(obj => ({
      type: obj.userData.type,
      color: obj.material && obj.material.color ? '#' + obj.material.color.getHexString() : '#527cff',
      position: obj.position.toArray(),
      rotation: obj.rotation.toArray(),
      scale: obj.scale.toArray()
    }))
  };
  core.updateProject({ settings: { ...(project.settings || {}), editorState } });
  return core.saveProject();
}

function restoreEditorState(editorState) {
  if (!editorState || typeof editorState !== 'object') return;
  if (typeof editorState.background === 'string' && /^#[0-9a-f]{6}$/i.test(editorState.background)) {
    scene.background = new THREE.Color(editorState.background);
    document.querySelector('#background').value = editorState.background;
  }
  if (Number.isFinite(editorState.light)) {
    sun.intensity = Math.max(0, Math.min(5, editorState.light));
    document.querySelector('#light').value = sun.intensity;
  }
  if (Array.isArray(editorState.objects)) {
    editorState.objects.forEach(item => {
      if (!item || !['box', 'sphere', 'cylinder', 'torus'].includes(item.type)) return;
      addObject(item.type, false);
      const obj = objects[objects.length - 1];
      if (item.color && /^#[0-9a-f]{6}$/i.test(item.color)) obj.material.color.set(item.color);
      if (Array.isArray(item.position) && item.position.length === 3 && item.position.every(Number.isFinite)) obj.position.fromArray(item.position);
      if (Array.isArray(item.rotation) && item.rotation.length === 3 && item.rotation.every(Number.isFinite)) obj.rotation.fromArray(item.rotation);
      if (Array.isArray(item.scale) && item.scale.length === 3 && item.scale.every(Number.isFinite)) obj.scale.fromArray(item.scale);
    });
  }
  updateList();
}

/* CARREGAMENTO DO PERSONAGEM */

function loadCharacter(){

const loadRevision = projectImportRevision;
const startupEditorState = window.Estudio3DCore
  ? (window.Estudio3DCore.getProject().settings || {}).editorState
  : null;
if (!pendingCharacterImport && startupEditorState && startupEditorState.hasCharacter === false) {
  restoreEditorState(startupEditorState);
  status('Cena restaurada sem personagem. Você pode adicionar objetos ou gerar um personagem pelo catálogo.');
  return;
}
if (!pendingCharacterImport && startupEditorState && startupEditorState.activeCharacter) {
  const savedRecord = window.Estudio3DCharacters
    ? window.Estudio3DCharacters.getCharacter(startupEditorState.activeCharacter.id)
    : null;
  if (savedRecord && savedRecord.model && savedRecord.model.source === 'procedural_preview') {
    characterRecordId = savedRecord.id;
    selectedCatalogRecordId = savedRecord.id;
    syncCharacterForm(savedRecord);
    restoreEditorState(startupEditorState);
    generateCharacterPrototype();
    const transform = startupEditorState.activeCharacter.transform || {};
    if (character) {
      if (Array.isArray(transform.position)) character.position.fromArray(transform.position);
      if (Array.isArray(transform.rotation)) character.rotation.fromArray(transform.rotation);
      if (Array.isArray(transform.scale)) character.scale.fromArray(transform.scale);
    }
    restoreAdditionalSceneCharacters(startupEditorState);
    persistEditorState();
    status('Personagem procedural e cena restaurados sem depender do arquivo GLB-base.');
    return;
  }
}

status('Carregando personagem 3D...');

const loader=new GLTFLoader();

loader.load(
'./man-base-character-rigged.glb',

(gltf)=>{

if (loadRevision !== projectImportRevision) return;
character=gltf.scene;
character.userData.type='personagem';
character.userData.isCharacter=true;

character.traverse((child)=>{

if(child.isMesh){

child.castShadow=true;
child.receiveShadow=true;
child.userData.editorRoot=character;

if(child.material){
child.material.side=THREE.DoubleSide;
}
}

});

const box=new THREE.Box3().setFromObject(character);
const size=box.getSize(new THREE.Vector3());
const center=box.getCenter(new THREE.Vector3());

if(size.y>0){

const targetHeight=3.2;
const factor=targetHeight/size.y;

character.scale.setScalar(factor);

character.position.set(
-center.x*factor,
-1.6-box.min.y*factor,
-center.z*factor
);

}

scene.add(character);
objects.push(character);

// Registra o modelo visual e restaura os dados importados, quando existirem.
try {
  const api = window.Estudio3DCharacters;
  if (api) {
    const loadingImportedProject = !!(pendingCharacterImport && pendingCharacterImport.record);
    const savedEditorState = !loadingImportedProject && window.Estudio3DCore
      ? (window.Estudio3DCore.getProject().settings || {}).editorState
      : null;
    let record;
    let restoreProcedural = false;
    let restoredProceduralTransform = null;
    if (pendingCharacterImport && pendingCharacterImport.record) {
      const imported = pendingCharacterImport.record;
      restoreProcedural = !!(imported.model && imported.model.source === 'procedural_preview');
      const existingImported = imported.id ? api.getCharacter(imported.id) : null;
      const importedData = {
        id: imported.id,
        name: imported.name || 'Personagem importado',
        category: imported.category || 'human',
        ageStage: imported.ageStage || 'adult',
        rigType: imported.rigType || 'unknown',
        description: imported.description || '',
        appearance: imported.appearance || {},
        visualDirection: imported.visualDirection || {},
        parts: imported.parts || {},
        gameReady: imported.gameReady || {},
        model: imported.model || { source: 'created_in_studio', format: 'glb', assetId: 'man-base-character-rigged.glb' },
        tags: imported.tags || []
      };
      record = existingImported
        ? api.updateCharacter(imported.id, importedData)
        : api.addCharacterToProject(importedData);
      const transform = pendingCharacterImport.transform;
      restoredProceduralTransform = transform || null;
      if (transform) {
        if (Array.isArray(transform.position)) character.position.fromArray(transform.position);
        if (Array.isArray(transform.rotation)) character.rotation.fromArray(transform.rotation);
        if (Array.isArray(transform.scale)) character.scale.fromArray(transform.scale);
      }
      pendingCharacterImport = null;
    } else {
      const savedActive = savedEditorState && savedEditorState.activeCharacter && savedEditorState.activeCharacter.id
        ? api.getCharacter(savedEditorState.activeCharacter.id)
        : null;
      const saved = savedActive || api.getCharacters().find(item =>
        item.model && item.model.assetId === 'man-base-character-rigged.glb'
      );
      restoreProcedural = !!(savedActive && savedActive.model && savedActive.model.source === 'procedural_preview');
      restoredProceduralTransform = savedEditorState && savedEditorState.activeCharacter
        ? savedEditorState.activeCharacter.transform || null
        : null;
      record = saved
        ? (restoreProcedural ? saved : api.updateCharacter(saved.id, {
            model: { source: 'created_in_studio', format: 'glb', assetId: 'man-base-character-rigged.glb' }
          }))
        : api.addCharacterToProject({
            name: 'Meu personagem', category: 'human', ageStage: 'adult', rigType: 'humanoid',
            description: 'Personagem carregado no editor 3D',
            model: { source: 'created_in_studio', format: 'glb', assetId: 'man-base-character-rigged.glb' }
          });
    }
    characterRecordId = record.id;
    selectedCatalogRecordId = record.id;
    syncCharacterForm(record);
    if (!restoreProcedural && restoredProceduralTransform) {
      const t = restoredProceduralTransform;
      if (Array.isArray(t.position)) character.position.fromArray(t.position);
      if (Array.isArray(t.rotation)) character.rotation.fromArray(t.rotation);
      if (Array.isArray(t.scale)) character.scale.fromArray(t.scale);
    }
    const savedResult = window.Estudio3DCore.saveProject();
    if (savedEditorState) restoreEditorState(savedEditorState);
    if (restoreProcedural) {
      scene.remove(character);
      const loadedIndex = objects.indexOf(character);
      if (loadedIndex >= 0) objects.splice(loadedIndex, 1);
      character = null;
      generateCharacterPrototype();
      if (restoredProceduralTransform && character) {
        const t = restoredProceduralTransform;
        if (Array.isArray(t.position)) character.position.fromArray(t.position);
        if (Array.isArray(t.rotation)) character.rotation.fromArray(t.rotation);
        if (Array.isArray(t.scale)) character.scale.fromArray(t.scale);
        persistEditorState();
      }
      restoreAdditionalSceneCharacters(savedEditorState);
      persistEditorState();
      return;
    }
    if (savedEditorState) {
      restoreAdditionalSceneCharacters(savedEditorState);
      persistEditorState();
    }
    status(savedResult.ok
      ? 'Personagem carregado e cadastrado no projeto.'
      : 'Personagem carregado; não foi possível salvar no navegador.');
  }
} catch (error) {
  console.error('[Estúdio 3D] Falha ao registrar/restaurar personagem:', error);
  pendingCharacterImport = null;
  status('Personagem carregado, mas houve falha ao registrar seus dados.');
}

gltf.animations.forEach((clip)=>{

animationActions.push(clip);

});

const select=document.querySelector('#animationSelect');
select.innerHTML='';

if(animationActions.length){

animationActions.forEach((clip,index)=>{

const option=document.createElement('option');
option.value=index;
option.textContent=clip.name||'Animação '+(index+1);
select.appendChild(option);

});

registerCharacterAnimations(character, animationActions);
activateCharacterAnimations(character);

select.disabled=false;
document.querySelector('#animate').disabled=false;
document.querySelector('#pauseAnimation').disabled=false;

status('Personagem carregado! '+animationActions.length+' animação(ões) encontrada(s).');

}else{

select.innerHTML='<option>Sem animações no modelo</option>';
status('Personagem carregado, mas o arquivo não possui animações.');
}

selectObject(character);
updateList();

},

undefined,

(error)=>{

console.error('Erro ao carregar personagem:',error);

status('Erro ao carregar o GLB. Confira se o arquivo está na mesma pasta da interface-v2.html.');

}
);

}

/* OBJETOS */

function addObject(type, persist = true){

let geometry;

if(type==='box') geometry=new THREE.BoxGeometry(1.4,1.4,1.4);
if(type==='sphere') geometry=new THREE.SphereGeometry(.85,32,24);
if(type==='cylinder') geometry=new THREE.CylinderGeometry(.7,.7,1.5,32);
if(type==='torus') geometry=new THREE.TorusGeometry(.7,.22,16,48);

const material=new THREE.MeshStandardMaterial({
color:'#527cff',
roughness:.45,
metalness:.1
});

const mesh=new THREE.Mesh(geometry,material);

mesh.position.set((Math.random()-.5)*2,0,0);
mesh.castShadow=true;
mesh.receiveShadow=true;
mesh.userData.type=type;
mesh.userData.editorRoot=mesh;

scene.add(mesh);
objects.push(mesh);

selectObject(mesh);
updateList();

status('Objeto adicionado.');
if (persist) persistEditorState();
}

function selectObject(obj){

selected=obj;

if(!obj)return;

if (obj.userData.isCharacter) {
  character = obj;
  activateCharacterAnimations(obj);

function syncCharacterForm(record) {
  if (!record) return;
  document.querySelector('#characterName').value = record.name || '';
  document.querySelector('#characterCategory').value = record.category || 'human';
  document.querySelector('#characterAge').value = record.ageStage || 'adult';
  document.querySelector('#characterRig').value = record.rigType || 'unknown';
  document.querySelector('#characterStyle').value =
    record.visualDirection && record.visualDirection.style
      ? record.visualDirection.style : 'definido pelo contexto';
  document.querySelector('#characterDescription').value = record.description || '';
  renderCharacterCatalog();
}

function getCharacterFormData() {
  return {
    name: document.querySelector('#characterName').value.trim() || 'Novo personagem',
    category: document.querySelector('#characterCategory').value,
    ageStage: document.querySelector('#characterAge').value,
    rigType: document.querySelector('#characterRig').value,
    description: document.querySelector('#characterDescription').value.trim(),
    visualDirection: {
      style: document.querySelector('#characterStyle').value
    }
  };
}

function renderCharacterCatalog() {
  const container = document.querySelector('#characterCatalog');
  if (!container || !window.Estudio3DCharacters) return;
  const records = window.Estudio3DCharacters.getCharacters();
  container.innerHTML = '';
  if (!records.length) {
    const empty = document.createElement('p');
    empty.textContent = 'Nenhum personagem cadastrado ainda.';
    empty.style.opacity = '.7';
    container.appendChild(empty);
    return;
  }
  records.forEach(record => {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:6px;align-items:center';
    const selectButton = document.createElement('button');
    selectButton.type = 'button';
    selectButton.textContent = record.name + ' · ' + record.category;
    selectButton.style.cssText = 'flex:1;min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis';
    selectButton.classList.toggle('active', record.id === selectedCatalogRecordId);
    selectButton.onclick = () => {
      selectedCatalogRecordId = record.id;
      syncCharacterForm(record);
      renderCharacterCatalog();
      status(record.model && record.model.assetId
        ? 'Cadastro selecionado. O modelo 3D associado pode ser carregado no editor.'
        : 'Cadastro selecionado. Modelo 3D ainda não associado.');
    };
    const addButton = document.createElement('button');
    addButton.type = 'button';
    addButton.textContent = '＋';
    const canAddProcedural = !record.model || !record.model.source ||
      record.model.source === 'not_created' || record.model.source === 'procedural_preview';
    addButton.title = canAddProcedural
      ? 'Adicionar uma cópia deste personagem à cena'
      : 'Instâncias de modelos 3D externos serão habilitadas em uma próxima etapa';
    addButton.disabled = !canAddProcedural;
    addButton.style.cssText = 'width:38px;flex:0 0 38px';
    addButton.onclick = () => addCharacterInstance(record.id);
    const deleteButton = document.createElement('button');
    deleteButton.type = 'button';
    deleteButton.textContent = '×';
    deleteButton.title = 'Excluir cadastro';
    deleteButton.style.cssText = 'width:38px;flex:0 0 38px';
    deleteButton.onclick = () => {
      const removed = window.Estudio3DCharacters.removeCharacter(record.id);
      if (removed) {
        if (selectedCatalogRecordId === record.id) selectedCatalogRecordId = null;
        if (characterRecordId === record.id) characterRecordId = null;
        const saved = window.Estudio3DCore.saveProject();
        renderCharacterCatalog();
        status(saved.ok
          ? 'Cadastro removido e projeto salvo. O modelo 3D da cena não foi apagado.'
          : 'Cadastro removido nesta sessão, mas não foi possível salvar no navegador.');
      }
    };
    row.append(selectButton, addButton, deleteButton);
    container.appendChild(row);
  });
}

// Geração procedural inicial: malha 3D de pré-visualização conforme a categoria.
function generateCharacterPrototype(options = {}) {
  const addToScene = options.addToScene === true;
  if (!window.Estudio3DCharacters || !selectedCatalogRecordId) {
    status('Crie ou selecione um personagem no catálogo antes de gerar o protótipo.');
    return;
  }

  const record = window.Estudio3DCharacters.getCharacter(selectedCatalogRecordId);
  if (!record) {
    status('Cadastro não encontrado. Selecione novamente o personagem.');
    return;
  }

  // A associação visual só muda quando o protótipo do cadastro selecionado é gerado.
  characterRecordId = selectedCatalogRecordId;

  // Ao substituir, encerra o mixer anterior; ao adicionar, preserva os demais.
  if (!addToScene && mixer) mixer.stopAllAction();

  // O editor mantém um personagem principal por vez: evita duplicatas ao regenerar.
  if (!addToScene && character) {
    const previousState = characterAnimationStates.get(character);
    if (previousState && previousState.mixer) previousState.mixer.stopAllAction();
    characterAnimationStates.delete(character);
    scene.remove(character);
    const previousIndex = objects.indexOf(character);
    if (previousIndex >= 0) objects.splice(previousIndex, 1);
  }

  const group = new THREE.Group();
  group.name = record.name || 'Personagem procedural';
  group.userData.type = 'procedural-character';
  group.userData.isCharacter = true;
  group.userData.proceduralCategory = record.category;
  group.userData.characterRecordId = record.id;

  const palette = {
    human: 0xc58d68, animal: 0xb9824d, creature: 0x687c9f,
    robot: 0x9aa8bd, alien: 0x65b99a, object: 0x527cff, other: 0x8b83b8
  };
  const savedPrimaryColor = record.appearance && record.appearance.colors
    ? record.appearance.colors.primary
    : null;
  const baseColor = savedPrimaryColor && /^#[0-9a-f]{6}$/i.test(savedPrimaryColor)
    ? savedPrimaryColor
    : (palette[record.category] || palette.other);
  const material = new THREE.MeshStandardMaterial({
    color: baseColor, roughness: 0.62, metalness: record.category === 'robot' ? 0.72 : 0.05
  });
  const savedAccentColor = record.appearance && record.appearance.colors
    ? record.appearance.colors.accent
    : null;
  const accent = new THREE.MeshStandardMaterial({
    color: savedAccentColor && /^#[0-9a-f]{6}$/i.test(savedAccentColor)
      ? savedAccentColor
      : (record.category === 'robot' ? 0x34445f : 0x26344f),
    roughness: 0.5, metalness: record.category === 'robot' ? 0.8 : 0.1
  });
  accent.name = 'character-accent';

  function part(geometry, mat, x, y, z) {
    const mesh = new THREE.Mesh(geometry, mat);
    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    mesh.userData.editorRoot = group;
    group.add(mesh);
    return mesh;
  }
  function limb(x1, y1, z1, x2, y2, z2, radius, mat = material) {
    const start = new THREE.Vector3(x1, y1, z1);
    const end = new THREE.Vector3(x2, y2, z2);
    const direction = new THREE.Vector3().subVectors(end, start);
    const mesh = part(new THREE.CylinderGeometry(radius * 0.82, radius, direction.length(), 12), mat,
      (x1+x2)/2, (y1+y2)/2, (z1+z2)/2);
    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), direction.normalize());
    return mesh;
  }

  const ageScale = {
    baby: 0.68, child: 0.82, teen: 0.94, adult: 1, senior: 0.97
  };
  if (record.category === 'avian' || (record.category === 'animal' && record.rigType === 'avian')) {
    // Protótipo de ave: corpo, cabeça, bico, asas, cauda e pernas.
    part(new THREE.SphereGeometry(0.58, 24, 18), material, 0, 0.12, 0);
    part(new THREE.SphereGeometry(0.34, 20, 16), material, 0, 0.55, 0.42);
    const beak = part(new THREE.ConeGeometry(0.13, 0.42, 12), accent, 0, 0.48, 0.78);
    beak.rotation.x = Math.PI / 2;
    for (const side of [-1, 1]) {
      const wing = part(new THREE.SphereGeometry(0.38, 18, 14), accent, side * 0.48, 0.16, -0.02);
      wing.scale.set(0.42, 0.72, 1.45);
      wing.rotation.z = side * -0.18;
      limb(side * 0.2, -0.25, 0.08, side * 0.2, -0.78, 0.08, 0.075, accent);
      part(new THREE.ConeGeometry(0.075, 0.22, 8), accent, side * 0.2, -0.86, 0.16);
    }
    for (let i = -1; i <= 1; i++) {
      const feather = part(new THREE.ConeGeometry(0.09, 0.48, 8), material, i * 0.15, 0.2, -0.58);
      feather.rotation.x = -Math.PI / 2.5;
    }
    part(new THREE.SphereGeometry(0.055, 10, 8), accent, -0.13, 0.62, 0.68);
    part(new THREE.SphereGeometry(0.055, 10, 8), accent, 0.13, 0.62, 0.68);
  } else if (record.category === 'animal') {
    // Protótipo quadrúpede com tronco, cabeça, quatro patas e cauda.
    part(new THREE.SphereGeometry(0.72, 24, 18), material, 0, 0.15, 0);
    part(new THREE.SphereGeometry(0.43, 20, 16), material, 0, 0.35, 0.78);
    for (const x of [-0.43, 0.43]) for (const z of [-0.42, 0.48]) {
      limb(x, 0.05, z, x, -0.82, z, 0.14);
    }
    limb(0, 0.2, -0.58, 0, 0.35, -1.12, 0.11);
    part(new THREE.SphereGeometry(0.09, 12, 10), accent, -0.17, 0.48, 1.13);
    part(new THREE.SphereGeometry(0.09, 12, 10), accent, 0.17, 0.48, 1.13);
  } else if (record.category === 'robot') {
    part(new THREE.BoxGeometry(1.05, 1.15, 0.62), material, 0, 0.15, 0);
    part(new THREE.BoxGeometry(0.72, 0.62, 0.58), material, 0, 1.05, 0);
    part(new THREE.BoxGeometry(0.42, 0.12, 0.08), accent, 0, 1.1, 0.31);
    for (const x of [-0.72, 0.72]) {
      limb(x, 0.55, 0, x * 1.2, -0.25, 0, 0.16, accent);
      limb(x * 0.48, -0.42, 0, x * 0.48, -1.18, 0, 0.19, accent);
    }
  } else if (record.category === 'object') {
    part(new THREE.BoxGeometry(1.15, 1.5, 0.72), material, 0, 0, 0);
    part(new THREE.SphereGeometry(0.38, 20, 16), material, 0, 1.05, 0);
    part(new THREE.SphereGeometry(0.07, 12, 10), accent, -0.14, 1.1, 0.34);
    part(new THREE.SphereGeometry(0.07, 12, 10), accent, 0.14, 1.1, 0.34);
    limb(-0.25, -0.72, 0, -0.3, -1.25, 0, 0.13);
    limb(0.25, -0.72, 0, 0.3, -1.25, 0, 0.13);
  } else {
    // Humanoide base para humanos, alienígenas, criaturas e outras categorias.
    part(new THREE.SphereGeometry(record.category === 'creature' ? 0.58 : 0.43, 24, 18), material, 0, 1.05, 0);
    part(new THREE.CapsuleGeometry(0.38, 0.82, 6, 12), material, 0, 0.05, 0);
    for (const x of [-0.52, 0.52]) {
      limb(x * 0.55, 0.45, 0, x * 1.15, -0.35, 0, 0.14);
      limb(x * 0.38, -0.45, 0, x * 0.48, -1.28, 0, 0.17);
    }
    part(new THREE.SphereGeometry(0.075, 12, 10), accent, -0.16, 1.12, 0.37);
    part(new THREE.SphereGeometry(0.075, 12, 10), accent, 0.16, 1.12, 0.37);
    if (record.category === 'alien' || record.category === 'creature') {
      part(new THREE.ConeGeometry(0.12, 0.48, 12), material, -0.36, 1.62, 0);
      part(new THREE.ConeGeometry(0.12, 0.48, 12), material, 0.36, 1.62, 0);
    }
  }

  // Restaura ajustes de transformação salvos no cadastro; na ausência deles,
  // mantém a escala padrão correspondente à fase da vida.
  const savedBody = record.appearance && record.appearance.body
    ? record.appearance.body
    : {};
  const savedEditorScale = Number(savedBody.editorScale);
  const savedEditorPositionX = Number(savedBody.editorPositionX);
  const savedEditorRotationY = Number(savedBody.editorRotationY);

  group.scale.setScalar(
    Number.isFinite(savedEditorScale) && savedEditorScale > 0
      ? savedEditorScale
      : (ageScale[record.ageStage] || 1)
  );
  group.position.set(
    Number.isFinite(savedEditorPositionX) ? savedEditorPositionX : 0,
    0,
    0
  );
  group.rotation.y = Number.isFinite(savedEditorRotationY)
    ? THREE.MathUtils.degToRad(savedEditorRotationY)
    : 0;
  scene.add(group);
  objects.push(group);
  character = group;
  selected = group;
  registerCharacterAnimations(group, []);
  activateCharacterAnimations(group);
  document.querySelector('#animationSelect').innerHTML = '<option>Protótipo sem animações</option>';
  document.querySelector('#animationSelect').disabled = true;
  document.querySelector('#animate').disabled = true;
  document.querySelector('#pauseAnimation').disabled = true;

  window.Estudio3DCharacters.updateCharacter(record.id, {
    model: { source: 'procedural_preview', format: 'threejs-runtime', assetId: '' },
    gameReady: { rigged: false, animated: false }
  });
  window.Estudio3DCore.saveProject();
  selectObject(group);
  updateList();
  status('Protótipo 3D gerado para ' + record.category + '. Você já pode exportar a malha em GLB; rigging e animações deste protótipo ainda não estão disponíveis.');
  persistEditorState();
}

document.querySelector('#generateCharacter3D').onclick = () => generateCharacterPrototype();

function addCharacterInstance(recordId, transform = null, options = {}) {
  if (!window.Estudio3DCharacters) return;
  const record = window.Estudio3DCharacters.getCharacter(recordId);
  if (!record) {
    status('Cadastro não encontrado. Atualize o catálogo e tente novamente.');
    return;
  }
  if (record.model && record.model.source &&
      !['not_created', 'procedural_preview'].includes(record.model.source)) {
    status('A inclusão de múltiplas instâncias de modelos GLB externos será habilitada em uma próxima etapa.');
    return;
  }
  selectedCatalogRecordId = recordId;
  syncCharacterForm(record);
  generateCharacterPrototype({ addToScene: true });
  if (!character) return;
  if (transform && Array.isArray(transform.position)) character.position.fromArray(transform.position);
  if (transform && Array.isArray(transform.rotation)) character.rotation.fromArray(transform.rotation);
  if (transform && Array.isArray(transform.scale)) character.scale.fromArray(transform.scale);
  character.userData.characterRecordId = recordId;
  if (options.offset !== false && !transform) {
    const instanceCount = objects.filter(obj => obj.userData.isCharacter).length;
    character.position.x += Math.max(0, instanceCount - 1) * 1.8;
  }
  selectObject(character);
  renderCharacterCatalog();
  updateList();
  if (options.persist !== false) persistEditorState();
  status('Cópia de ' + record.name + ' adicionada à cena. Cada personagem pode ser selecionado e transformado separadamente.');
}

function restoreAdditionalSceneCharacters(editorState) {
  if (!editorState || !Array.isArray(editorState.sceneCharacters)) return;
  const activeRoot = character;
  const activeRecordId = characterRecordId;
  const activeSelection = selected;
  editorState.sceneCharacters.forEach(instance => {
    if (!instance || instance.active || instance.source !== 'procedural_preview') return;
    const record = window.Estudio3DCharacters &&
      window.Estudio3DCharacters.getCharacter(instance.recordId);
    if (record) addCharacterInstance(instance.recordId, instance.transform, { persist: false, offset: false });
  });
  character = activeRoot;
  characterRecordId = activeRecordId;
  selected = activeSelection;
  if (activeSelection) selectObject(activeSelection);
  updateList();
}

function persistSelectedCharacter(patch) {
  if (!selected || !selected.userData.isCharacter || !characterRecordId) return;
  try {
    window.Estudio3DCharacters.updateCharacter(characterRecordId, patch);
    window.Estudio3DCore.saveProject();
  } catch (error) {
    console.error('[Estúdio 3D] Não foi possível salvar os ajustes:', error);
    status('Ajuste aplicado no visor, mas não foi salvo no cadastro.');
  }
}

/* ANIMAÇÕES */

function playAnimation(index){

if(!mixer||!animationActions[index])return;

if(activeAction){
activeAction.fadeOut(.2);
}

const clip=animationActions[index];

activeAction=mixer.clipAction(clip);
const activeAnimationState = characterAnimationStates.get(character);
if (activeAnimationState) activeAnimationState.activeAction = activeAction;
activeAction.reset();
activeAction.fadeIn(.2);
activeAction.play();

status('Animação: '+(clip.name||'Movimento'));

}

document.querySelector('#animate').onclick=()=>{

const index=Number(document.querySelector('#animationSelect').value);

if(!animationActions.length){
status('Nenhuma animação disponível.');
return;
}

if(activeAction&&activeAction.isRunning()){

activeAction.stop();
activeAction=null;
status('Animação parada.');

}else{

playAnimation(index);

}

};

document.querySelector('#pauseAnimation').onclick=()=>{

if(!mixer||!activeAction){
status('Nenhuma animação está em execução.');
return;
}

mixer.timeScale=mixer.timeScale===0?1:0;

document.querySelector('#pauseAnimation').textContent=
mixer.timeScale===0?'▶ Continuar animação':'Ⅱ Pausar animação';

status(mixer.timeScale===0?'Animação pausada.':'Animação retomada.');

};

document.querySelector('#animationSelect').onchange=e=>{

if(animationActions.length){
playAnimation(Number(e.target.value));
}

};

/* EXCLUIR E NOVA CENA */

document.querySelector('#delete').onclick=()=>{

if(!selected){
status('Selecione um objeto primeiro.');
return;
}

const removedObject = selected;
const removedAnimationState = characterAnimationStates.get(removedObject);
if (removedAnimationState && removedAnimationState.mixer) removedAnimationState.mixer.stopAllAction();
characterAnimationStates.delete(removedObject);
scene.remove(removedObject);
const removedIndex = objects.indexOf(removedObject);
if (removedIndex >= 0) objects.splice(removedIndex, 1);

if (removedObject.userData.isCharacter && removedObject === character) {
  if (mixer) mixer.stopAllAction();
  mixer = null;
  activeAction = null;
  animationActions = [];
  character = objects.find(obj => obj.userData.isCharacter) || null;
  characterRecordId = character ? (character.userData.characterRecordId || null) : null;
  document.querySelector('#animationSelect').innerHTML = character
    ? '<option>Animação não carregada para este personagem</option>'

function saveProject(){

  ? window.Estudio3DCharacters.getCharacter(characterRecordId)

  ? window.Estudio3DCharacters.getCharacters()
  : [];

  .map(record => ({

sceneCharacters: objects.filter(obj => obj.userData.isCharacter).map(obj => ({

    rotation: obj.rotation.toArray(),
    scale: obj.scale.toArray()
  }
})),

// Inclui os metadados universais e a transformação do personagem no arquivo.
character: characterData ? {
  record: characterData,
  transform: {
    position: character.position.toArray(),
    rotation: character.rotation.toArray(),
    scale: character.scale.toArray()
  }
} : null,

objects:objects

};

}

// Cria um pacote portátil com o projeto JSON e todos os modelos GLB externos.
document.querySelector('#exportBundle').onclick = async () => {
  try {
    if (!window.JSZip) throw new Error('A biblioteca de compactação não foi carregada. Verifique sua conexão e tente novamente.');
    const project = saveProject();
    const requiredAssets = project.assetManifest || [];
    const missingAssets = requiredAssets.filter(asset => !externalModelAssets.has(asset.characterId));
    if (missingAssets.length) {
      const names = missingAssets.map(asset => asset.fileName || asset.assetId).join(', ');
      throw new Error('Antes de criar o pacote, importe novamente estes modelos GLB para anexar os arquivos originais: ' + names);
    }

    const zip = new window.JSZip();
    const bundledProject = JSON.parse(JSON.stringify(project));
    const assetFolder = zip.folder('assets');
    bundledProject.assetManifest = bundledProject.assetManifest.map(asset => {
      const stored = externalModelAssets.get(asset.characterId);
      const safeName = String(stored.fileName || asset.fileName || 'model.glb')
        .replace(/[^a-z0-9._-]/gi, '_');
      const safeCharacterId = String(asset.characterId).replace(/[^a-z0-9_-]/gi, '_');
      const archivePath = 'assets/' + safeCharacterId + '/' + safeName;
      zip.file(archivePath, stored.data);
      return { ...asset, fileName: safeName, archivePath, embedded: true };
    });
    zip.file('project.json', JSON.stringify(bundledProject, null, 2));
    const blob = await zip.generateAsync({
      type: 'blob',
      compression: 'DEFLATE',
      compressionOptions: { level: 6 }
    });
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement('a');
    anchor.href = url;
    anchor.download = 'meu-projeto-3d-completo.zip';
    anchor.click();
    anchor.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    status('Pacote ZIP criado com o projeto e todos os modelos GLB associados.');
  } catch (error) {
    console.error('[Estúdio 3D] Falha ao criar pacote ZIP:', error);
    status('Não foi possível criar o pacote completo: ' + error.message);
  }
};

document.querySelector('#glbFile').onchange = async (event) => {

  const addToScene = event.target.dataset.addToScene === 'true';
  event.target.dataset.addToScene = 'false';
  if (!file) return;
  try {
    if (!file.name.toLowerCase().endsWith('.glb')) {
      throw new Error('Selecione um arquivo .glb válido.');
    }
    if (!window.Estudio3DCharacters || !window.Estudio3DCore) {
      throw new Error('O sistema de personagens ainda não está disponível.');
    }
    status('Lendo modelo GLB...');
    const buffer = await file.arrayBuffer();
    const loader = new GLTFLoader();
    loader.parse(buffer, '', (gltf) => {
      try {
        const importedCharacter = gltf.scene;
        importedCharacter.name = file.name.replace(/\.glb$/i, '') || 'Personagem importado';
        importedCharacter.userData.type = 'personagem';
        importedCharacter.userData.isCharacter = true;
        importedCharacter.traverse((child) => {
          if (!child.isMesh) return;
          child.castShadow = true;
          child.receiveShadow = true;
          child.userData.editorRoot = importedCharacter;
          if (child.material) child.material.side = THREE.DoubleSide;
        });

        if (!addToScene && character) {
          const previousState = characterAnimationStates.get(character);
          if (previousState && previousState.mixer) previousState.mixer.stopAllAction();
          characterAnimationStates.delete(character);
          scene.remove(character);
          const previousIndex = objects.indexOf(character);
          if (previousIndex >= 0) objects.splice(previousIndex, 1);
        }

        let record = (!addToScene && selectedCatalogRecordId)
          ? window.Estudio3DCharacters.getCharacter(selectedCatalogRecordId)
          : null;
        const modelInfo = {
          source: 'external_file',
          format: 'glb',
          assetId: file.name,
          fileName: file.name,
          embedded: false
        };
        const characterForm = {
          ...getCharacterFormData(),
          ...(addToScene ? { name: file.name.replace(/\.glb$/i, '') || 'Personagem importado' } : {}),
          model: modelInfo
        };
        if (record) {
          record = window.Estudio3DCharacters.updateCharacter(record.id, characterForm);
        } else {
          record = window.Estudio3DCharacters.addCharacterToProject(characterForm);
        }

        externalModelAssets.set(record.id, { fileName: file.name, data: buffer });
        importedCharacter.userData.characterRecordId = record.id;
        if (addToScene) {
          importedCharacter.position.x = objects.filter(obj => obj.userData.isCharacter).length * 1.8;
        }
        character = importedCharacter;
        characterRecordId = record.id;
        selectedCatalogRecordId = record.id;
        scene.add(importedCharacter);
        objects.push(importedCharacter);
        registerCharacterAnimations(importedCharacter, gltf.animations);

        syncCharacterForm(record);
        selectObject(importedCharacter);
        updateList();
        const saved = window.Estudio3DCore.saveProject();
        persistEditorState();
        status(saved.ok
          ? (addToScene
            ? 'Novo personagem GLB adicionado à cena. Sua animação é independente; o pacote ZIP incluirá o arquivo.'
            : 'Modelo GLB importado e associado ao cadastro. Guarde o arquivo original junto do projeto.')
          : 'Modelo GLB carregado, mas não foi possível salvar os metadados no navegador.');
      } catch (error) {
        console.error('[Estúdio 3D] Falha ao preparar GLB importado:', error);
        status('Não foi possível preparar o personagem GLB: ' + error.message);
      }
    }, (error) => {
      console.error('[Estúdio 3D] Falha ao ler GLB:', error);
      status('Arquivo GLB inválido ou incompatível.');
    });
  } catch (error) {
    console.error('[Estúdio 3D] Falha na importação GLB:', error);
    status('Não foi possível importar o GLB: ' + error.message);
  } finally {
    event.target.value = '';
  }
};

function parseGLBBuffer(buffer) {
  if (!(buffer instanceof ArrayBuffer) || buffer.byteLength < 20) {
    return Promise.reject(new Error('O arquivo GLB está vazio ou incompleto.'));
  }
  const header = new DataView(buffer);
  if (header.getUint32(0, true) !== 0x46546c67 || header.getUint32(4, true) !== 2 ||
      header.getUint32(8, true) !== buffer.byteLength) {
    return Promise.reject(new Error('Um dos arquivos do pacote não possui cabeçalho GLB 2.0 válido.'));
  }
  return new Promise((resolve, reject) => {
    try {
      new GLTFLoader().parse(buffer, '', resolve, reject);
    } catch (error) {
      reject(error);
    }
  });
}

document.querySelector('#bundleFile').onchange = async (event) => {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  try {
    if (!file.name.toLowerCase().endsWith('.zip')) {
      throw new Error('Selecione um pacote .zip.');
    }
    if (file.size > 150 * 1024 * 1024) {
      throw new Error('O pacote ZIP excede o limite de 150 MB.');
    }
    if (!window.JSZip) {
      throw new Error('A biblioteca de compactação não foi carregada. Verifique sua conexão e tente novamente.');
    }

    status('Verificando pacote ZIP...');
    const zip = await window.JSZip.loadAsync(file, { checkCRC32: true });
    const entries = Object.values(zip.files);
    if (entries.length > 1000) throw new Error('O pacote contém arquivos demais.');
    let declaredArchiveBytes = 0;
    for (const entry of entries) {
      if (!entry.dir && entry._data && Number.isFinite(entry._data.uncompressedSize)) {
        declaredArchiveBytes += entry._data.uncompressedSize;
      }
    }
    if (declaredArchiveBytes > 300 * 1024 * 1024) {
      throw new Error('O conteúdo descompactado do ZIP excede o limite de 300 MB.');
    }
    for (const entry of entries) {
      const name = entry.name;
      if (name.includes('\\') || name.startsWith('/') || /^[a-z]:/i.test(name) ||
          name.split('/').some(part => part === '..' || part === '.')) {
        throw new Error('O pacote contém um caminho de arquivo inseguro.');
      }
    }

    const projectEntry = zip.file('project.json');
    if (!projectEntry) throw new Error('O pacote não contém project.json.');
    const projectText = await projectEntry.async('string');
    if (projectText.length > 5 * 1024 * 1024) throw new Error('O arquivo de projeto excede 5 MB.');
    const project = JSON.parse(projectText);
    if (project.version !== 4 || !Array.isArray(project.objects)) {
      throw new Error('O pacote contém uma versão de projeto não suportada.');
    }
    if (!Array.isArray(project.assetManifest)) {
      throw new Error('O manifesto de modelos do pacote está ausente ou inválido.');
    }

    const records = Array.isArray(project.characters) ? project.characters : [];
    const recordIds = new Set(records.map(record => record && record.id));
    const manifestIds = new Set();
    const manifestPaths = new Set();
    const preparedAssets = new Map();
    let totalAssetBytes = 0;

    status('Validando modelos 3D do pacote...');
    for (const asset of project.assetManifest) {
      if (!asset || typeof asset.characterId !== 'string' ||
          !recordIds.has(asset.characterId) || manifestIds.has(asset.characterId)) {
        throw new Error('O manifesto contém um personagem inválido ou duplicado.');
      }
      manifestIds.add(asset.characterId);
      if (asset.format !== 'glb' || asset.embedded !== true ||
          typeof asset.archivePath !== 'string' ||
          !/^assets\/[a-z0-9_-]+\/[a-z0-9._-]+\.glb$/i.test(asset.archivePath)) {
        throw new Error('O manifesto contém um caminho ou formato de modelo inválido.');
      }
      const safeCharacterId = asset.characterId.replace(/[^a-z0-9_-]/gi, '_');
      if (!asset.archivePath.startsWith('assets/' + safeCharacterId + '/') || manifestPaths.has(asset.archivePath)) {
        throw new Error('O caminho do modelo não corresponde ao personagem ou está duplicado.');
      }
      manifestPaths.add(asset.archivePath);
      const entry = zip.file(asset.archivePath);
      if (!entry || entry.dir) throw new Error('Modelo obrigatório ausente: ' + asset.fileName);
      if (entry._data && Number.isFinite(entry._data.uncompressedSize) &&
          entry._data.uncompressedSize > 100 * 1024 * 1024) {
        throw new Error('Um modelo GLB excede 100 MB.');
      }
      const buffer = await entry.async('arraybuffer');
      if (buffer.byteLength > 100 * 1024 * 1024) throw new Error('Um modelo GLB excede 100 MB.');
      totalAssetBytes += buffer.byteLength;
      if (totalAssetBytes > 250 * 1024 * 1024) throw new Error('Os modelos do pacote excedem o limite total de 250 MB.');
      const gltf = await parseGLBBuffer(buffer);
      preparedAssets.set(asset.characterId, {
        fileName: asset.fileName || 'model.glb',
        data: buffer,
        gltf
      });
    }

    const externalRecords = records.filter(record => record && record.model &&
      record.model.source === 'external_file' && record.model.assetId);
    if (externalRecords.some(record => !manifestIds.has(record.id))) {
      throw new Error('O manifesto não inclui todos os modelos externos obrigatórios do catálogo.');
    }

    // O importador JSON existente faz a validação do catálogo e das transformações.
    status('Restaurando projeto e catálogo...');
    const projectFile = new File([projectText], 'project.json', { type: 'application/json' });
    lastProjectImportSucceeded = false;
    await document.querySelector('#file').onchange({
      target: { files: [projectFile], value: '' }
    });
    if (!lastProjectImportSucceeded) {
      throw new Error('O projeto JSON não passou pela validação. A cena não será completada com os modelos.');
    }

    externalModelAssets.clear();
    preparedAssets.forEach((asset, id) => {
      externalModelAssets.set(id, { fileName: asset.fileName, data: asset.data });
    });

    // Restaura na cena o modelo correspondente ao personagem ativo no projeto.
    const activeId = project.character && project.character.record && project.character.record.id;
    const activeAsset = activeId ? preparedAssets.get(activeId) : null;
    if (!activeAsset && activeId && project.character && project.character.record &&
        project.character.record.model && project.character.record.model.source === 'procedural_preview') {
      selectedCatalogRecordId = activeId;
      const proceduralRecord = window.Estudio3DCharacters.getCharacter(activeId);
      if (proceduralRecord) {
        syncCharacterForm(proceduralRecord);
        generateCharacterPrototype();
        const transform = project.character.transform || {};
        if (character) {
          if (Array.isArray(transform.position)) character.position.fromArray(transform.position);
          if (Array.isArray(transform.rotation)) character.rotation.fromArray(transform.rotation);
          if (Array.isArray(transform.scale)) character.scale.fromArray(transform.scale);
        }
      }
    }
    if (activeAsset) {
      if (character) {
        const oldState = characterAnimationStates.get(character);
        if (oldState && oldState.mixer) oldState.mixer.stopAllAction();
        characterAnimationStates.delete(character);
        scene.remove(character);
        const oldIndex = objects.indexOf(character);
        if (oldIndex >= 0) objects.splice(oldIndex, 1);
      }
      if (mixer) mixer.stopAllAction();
      mixer = null;
      activeAction = null;
      animationActions = [];

      const root = activeAsset.gltf.scene;
      root.name = activeAsset.fileName.replace(/\.glb$/i, '') || 'Personagem importado';
      root.userData.type = 'personagem';
      root.userData.isCharacter = true;
      root.userData.characterRecordId = activeId;
      root.traverse(child => {
        if (!child.isMesh) return;
        child.castShadow = true;
        child.receiveShadow = true;
        child.userData.editorRoot = root;
        if (child.material) child.material.side = THREE.DoubleSide;
      });
      character = root;
      characterRecordId = activeId;
      selectedCatalogRecordId = activeId;
      const transform = project.character.transform || {};
      if (Array.isArray(transform.position)) root.position.fromArray(transform.position);
      if (Array.isArray(transform.rotation)) root.rotation.fromArray(transform.rotation);
      if (Array.isArray(transform.scale)) root.scale.fromArray(transform.scale);
      scene.add(root);
      objects.push(root);

      const select = document.querySelector('#animationSelect');
      select.innerHTML = '';
      animationActions = activeAsset.gltf.animations || [];
      if (animationActions.length) {
        animationActions.forEach((clip, index) => {
          const option = document.createElement('option');
          option.value = index;
          option.textContent = clip.name || 'Animação ' + (index + 1);
          select.appendChild(option);
        });
        registerCharacterAnimations(root, animationActions);
        activateCharacterAnimations(root);
        select.disabled = false;
        document.querySelector('#animate').disabled = false;
        document.querySelector('#pauseAnimation').disabled = false;
      } else {
        select.innerHTML = '<option>Sem animações no modelo</option>';
        select.disabled = true;
        document.querySelector('#animate').disabled = true;
        document.querySelector('#pauseAnimation').disabled = true;
      }
      const activeRecord = window.Estudio3DCharacters.getCharacter(activeId);
      if (activeRecord) syncCharacterForm(activeRecord);
      selectObject(root);
    }

    // Recria também os demais personagens GLB registrados na cena, cada um
    // com seu próprio mixer e transformação, sem tocar no personagem ativo.
    (Array.isArray(project.sceneCharacters) ? project.sceneCharacters : [])
      .filter(instance => instance && !instance.active && instance.source === 'external_file')
      .forEach(instance => {
        const asset = preparedAssets.get(instance.recordId);
        if (!asset) return;
        const root = asset.gltf.scene;
        root.name = asset.fileName.replace(/\.glb$/i, '') || 'Personagem importado';
        root.userData.type = 'personagem';
        root.userData.isCharacter = true;
        root.userData.characterRecordId = instance.recordId;
        root.traverse(child => {
          if (!child.isMesh) return;
          child.castShadow = true;
          child.receiveShadow = true;
          child.userData.editorRoot = root;
          if (child.material) child.material.side = THREE.DoubleSide;
        });
        const transform = instance.transform || {};
        if (Array.isArray(transform.position)) root.position.fromArray(transform.position);
        if (Array.isArray(transform.rotation)) root.rotation.fromArray(transform.rotation);
        if (Array.isArray(transform.scale)) root.scale.fromArray(transform.scale);
        scene.add(root);
        objects.push(root);
        registerCharacterAnimations(root, asset.gltf.animations || []);
      });

    renderCharacterCatalog();
    updateList();
    window.Estudio3DCore.saveProject();
    persistEditorState();
    status('Projeto ZIP restaurado com ' + preparedAssets.size + ' modelo(s) GLB. Confira a cena e o catálogo.');
  } catch (error) {
    console.error('[Estúdio 3D] Falha ao importar pacote ZIP:', error);
    status('Não foi possível abrir o pacote: ' + error.message);
  } finally {
    event.target.value = '';
  }
};


document.querySelector('#file').onchange=async e=>{

const file=e.target.files[0];

if(!file)return;
lastProjectImportSucceeded = false;

try{

const data=JSON.parse(await file.text());

if(!Array.isArray(data.objects)){
throw new Error('Arquivo inválido: lista de objetos ausente.');
}
if(data.version && ![2,3,4].includes(data.version)){
throw new Error('Versão de projeto não suportada.');
}

// Valida os dados portáteis antes de alterar a cena ou o projeto atual.
for (const item of data.objects) {
  if (!item || !['box', 'sphere', 'cylinder', 'torus'].includes(item.type)) continue;
  for (const key of ['position', 'rotation', 'scale']) {
    if (!Array.isArray(item[key]) || item[key].length !== 3 || !item[key].every(Number.isFinite)) {
      throw new Error('O projeto contém transformação inválida em um objeto.');
    }
  }
  if (typeof item.color !== 'string' || !/^#[0-9a-f]{6}$/i.test(item.color)) {
    throw new Error('O projeto contém uma cor inválida em um objeto.');
  }
}

// Valida a lista de instâncias quando presente, mantendo compatibilidade com projetos antigos.
if (data.sceneCharacters !== undefined) {
  if (!Array.isArray(data.sceneCharacters) || data.sceneCharacters.length > 500) {
    throw new Error('A lista de personagens da cena é inválida ou excede o limite.');
  }
  for (const instance of data.sceneCharacters) {
    if (!instance || typeof instance.recordId !== 'string' ||
        !['procedural_preview', 'external_file'].includes(instance.source) ||
        !instance.transform || !['position', 'rotation', 'scale'].every(key =>
          Array.isArray(instance.transform[key]) && instance.transform[key].length === 3 &&
          instance.transform[key].every(Number.isFinite))) {
      throw new Error('Uma instância de personagem contém dados inválidos.');
    }
  }
}

let normalizedRecords = null;
if (window.Estudio3DCharacters && window.Estudio3DCore) {
  const sourceRecords = Array.isArray(data.characters)
    ? data.characters
    : (data.character && data.character.record ? [data.character.record] : []);
  normalizedRecords = sourceRecords.map((source) => {
    if (!source || typeof source !== 'object' || Array.isArray(source)) {
      throw new Error('O catálogo contém um cadastro inválido.');
    }
    const normalized = window.Estudio3DCharacters.createCharacter(source);
    const validation = window.Estudio3DCharacters.validateCharacter(normalized);
    if (!validation.valid) throw new Error(validation.errors.join(' '));
    if (data.character && data.character.record === source) {
      data.character.record.id = normalized.id;
    }
    return normalized;
  });
  const ids = normalizedRecords.map(record => record.id);
  if (new Set(ids).size !== ids.length) {
    throw new Error('O catálogo importado contém identificadores duplicados.');
  }
}

// Invalida um carregamento inicial que ainda esteja em andamento antes de alterar a cena.
projectImportRevision += 1;

// Um projeto sem personagem ativo deve substituir também o personagem da cena atual.
if (!data.character && character) {
  scene.remove(character);
  const currentIndex = objects.indexOf(character);
  if (currentIndex >= 0) objects.splice(currentIndex, 1);
  character = null;
  characterRecordId = null;
  selectedCatalogRecordId = null;
  if (mixer) mixer.stopAllAction();
  mixer = null;
  activeAction = null;
  animationActions = [];
  document.querySelector('#animationSelect').innerHTML = '<option>Sem personagem</option>';
  document.querySelector('#animationSelect').disabled = true;
  document.querySelector('#animate').disabled = true;
  document.querySelector('#pauseAnimation').disabled = true;
}

objects.filter(o=>!o.userData.isCharacter).forEach(o=>scene.remove(o));

for(let i=objects.length-1;i>=0;i--){

if(!objects[i].userData.isCharacter){
objects.splice(i,1);
}

}

data.objects.forEach(item=>{

if(!['box','sphere','cylinder','torus'].includes(item.type))return;

addObject(item.type);

const o=objects[objects.length-1];

o.material.color.set(item.color);
o.position.fromArray(item.position);
o.rotation.fromArray(item.rotation);
o.scale.fromArray(item.scale);

});

if(data.background){
const backgroundValue = String(data.background).startsWith('#') ? data.background : '#'+data.background;
scene.background=new THREE.Color(backgroundValue);
document.querySelector('#background').value=backgroundValue;
}

if(Number.isFinite(data.light)){
sun.intensity=data.light;
document.querySelector('#light').value=data.light;
}

// Aplica o catálogo somente depois que todos os dados foram validados.
if (normalizedRecords && window.Estudio3DCore) {
  window.Estudio3DCore.updateProject({ characters: normalizedRecords });
  renderCharacterCatalog();
}

// Restaura os metadados e a transformação do personagem importado.
if(data.character && data.character.record){
  if(character && window.Estudio3DCharacters){
    const imported = data.character.record;
    const existing = window.Estudio3DCharacters.getCharacter(imported.id);
    const patch = {
      name: imported.name || 'Personagem importado',
      category: imported.category || 'human',
      ageStage: imported.ageStage || 'adult',
      rigType: imported.rigType || 'unknown',
      description: imported.description || '',
      appearance: imported.appearance || {},
      visualDirection: imported.visualDirection || {},
      parts: imported.parts || {},
      gameReady: imported.gameReady || {},
      model: imported.model || {},
      tags: imported.tags || []
    };
    const restored = existing
      ? window.Estudio3DCharacters.updateCharacter(imported.id, patch)
      : window.Estudio3DCharacters.addCharacterToProject({ ...patch, id: imported.id });
    characterRecordId = restored.id;
    selectedCatalogRecordId = restored.id;
    const transform = data.character.transform || {};
    if (imported.model && imported.model.source === 'procedural_preview') {
      if (character) {
        scene.remove(character);
        const oldIndex = objects.indexOf(character);
        if (oldIndex >= 0) objects.splice(oldIndex, 1);
      }
      character = null;
      generateCharacterPrototype();
    }
    if(character) {
      if(Array.isArray(transform.position)) character.position.fromArray(transform.position);
      if(Array.isArray(transform.rotation)) character.rotation.fromArray(transform.rotation);
      if(Array.isArray(transform.scale)) character.scale.fromArray(transform.scale);
    }
  } else {
    pendingCharacterImport = data.character;
  }
}

// Restaura instâncias procedurais adicionais sem duplicar o personagem ativo.
if (Array.isArray(data.sceneCharacters)) {
  const activeInstance = data.sceneCharacters.find(instance => instance.active);
  const importedActiveRoot = character;
  const importedActiveRecordId = characterRecordId;
  const importedActiveSelection = selected;
  data.sceneCharacters.forEach(instance => {
    if (instance.active) {
      if (character && activeInstance && activeInstance.recordId === characterRecordId) {
        if (Array.isArray(instance.transform.position)) character.position.fromArray(instance.transform.position);
        if (Array.isArray(instance.transform.rotation)) character.rotation.fromArray(instance.transform.rotation);
        if (Array.isArray(instance.transform.scale)) character.scale.fromArray(instance.transform.scale);
      }
      return;
    }
    if (instance.source !== 'procedural_preview') return;
    const instanceRecord = window.Estudio3DCharacters &&
      window.Estudio3DCharacters.getCharacter(instance.recordId);
    if (instanceRecord) addCharacterInstance(instance.recordId, instance.transform, { offset: false, persist: false });
  });
  character = importedActiveRoot;
  characterRecordId = importedActiveRecordId;
  selected = importedActiveSelection;
}

selected=(data.character && character) ? character : (objects[objects.length-1]||null);
if(selected) selectObject(selected);
updateList();
if(window.Estudio3DCore) window.Estudio3DCore.saveProject();
lastProjectImportSucceeded = true;
status(data.character
  ? 'Projeto importado. Os dados do personagem foram restaurados; o modelo GLB precisa estar disponível.'
  : 'Projeto importado.');

}catch(err){

console.error(err);
status('Não foi possível abrir esse projeto.');

}

e.target.value='';

};

/* CÂMERA E SELEÇÃO */

function resize(){

const w=canvas.clientWidth;
const h=canvas.clientHeight;

if(!w||!h)return;

renderer.setSize(w,h,false);

camera.aspect=w/h;
camera.updateProjectionMatrix();

}

new ResizeObserver(resize).observe(canvas.parentElement);
resize();

canvas.addEventListener('pointerdown',e=>{

dragging=true;
lastX=e.clientX;
lastY=e.clientY;

canvas.setPointerCapture(e.pointerId);

});

canvas.addEventListener('pointermove',e=>{

if(!dragging)return;

const dx=e.clientX-lastX;
const dy=e.clientY-lastY;

lastX=e.clientX;
lastY=e.clientY;

if(selected&&mode!=='move'){

if(mode==='rotate'){
selected.rotation.y+=dx*.01;
}

if(mode==='scale'){

const s=Math.max(.2,Math.min(4,selected.scale.x+dx*.01));
selected.scale.setScalar(s);

}

}else{

cameraSpin+=dx*.008;

camera.position.x=8*Math.sin(cameraSpin);
camera.position.z=8*Math.cos(cameraSpin);

camera.position.y=Math.max(1,Math.min(8,camera.position.y-dy*.02));

camera.lookAt(0,0,0);

}

});

canvas.addEventListener('pointerup',e=>{

dragging=false;
persistEditorState();

const rect=canvas.getBoundingClientRect();

pointer.x=((e.clientX-rect.left)/rect.width)*2-1;
pointer.y=-((e.clientY-rect.top)/rect.height)*2+1;

raycaster.setFromCamera(pointer,camera);

const hits=raycaster.intersectObjects(objects,true);

if(hits.length){

const root=hits[0].object.userData.editorRoot||hits[0].object;

selectObject(root);

status('Objeto selecionado.');

}

});

canvas.addEventListener('pointercancel',()=>dragging=false);

/* LOOP DE RENDERIZAÇÃO */

function loop(){

requestAnimationFrame(loop);

const delta=clock.getDelta();

const updatedMixers = new Set();
characterAnimationStates.forEach(state => {
  if (state.mixer) {
    state.mixer.update(delta);
    updatedMixers.add(state.mixer);
  }
});
if (mixer && !updatedMixers.has(mixer)) mixer.update(delta);

renderer.render(scene,camera);

}

loop();

/* INICIAR */

if (window.Estudio3DCore) window.Estudio3DCore.loadProject();
loadCharacter();
renderCharacterCatalog();

status('Estúdio 3D iniciado. Carregando personagem...');

</script>
</body>
