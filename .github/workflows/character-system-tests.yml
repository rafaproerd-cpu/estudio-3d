name: Testes do sistema de personagens

on:
  push:
    branches: [main]
    paths:
      - 'character-system.js'
      - 'rig-system.js'
      - 'teste-estudio.html'
      - 'tests/rig-system.test.cjs'
      - 'estudio-core.js'
      - 'interface-v2.html'
      - 'tests/**'
      - '.github/workflows/character-system-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'character-system.js'
      - 'estudio-core.js'
      - 'interface-v2.html'
      - 'tests/**'
      - '.github/workflows/character-system-tests.yml'
  workflow_dispatch:

jobs:
  character-system:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validar sintaxe do módulo do editor 3D
        run: |
          python - <<'PY' | node --check --input-type=module
          from pathlib import Path
          import re
          html = Path('interface-v2.html').read_text(encoding='utf-8')
          match = re.search(r'<script type="module">([\s\S]*?)</script>', html)
          if not match:
              raise SystemExit('Módulo principal do editor não encontrado.')
          print(match.group(1))
          PY
      - name: Executar testes automatizados
        run: node --test tests/*.test.cjs
