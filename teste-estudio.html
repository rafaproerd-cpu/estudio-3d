
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estúdio 3D — Ambiente de teste</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10131b;color:#fff;font-family:Arial,sans-serif}
header{min-height:60px;background:#191e2b;border-bottom:1px solid #30384b;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:12px}
header h2{font-size:19px;margin:0}
.status{font-size:11px;color:#62e6a5;text-align:right}
main{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 60px)}
aside{background:#191e2b;padding:16px;border-right:1px solid #30384b}
h3{font-size:13px;color:#9eacc8;text-transform:uppercase;margin:8px 0 16px}
label{display:block;font-size:13px;margin:18px 0 8px}
input,button{width:100%}
input[type=range]{accent-color:#6685ff}
button,.upload{background:#29334a;color:white;border:1px solid #465575;border-radius:8px;padding:11px;margin:5px 0;font-size:13px;cursor:pointer;text-align:center}
button:active{background:#526bff}
.upload{display:block}
input[type=file]{display:none}
.viewer{position:relative;min-width:0;min-height:500px;background:#10131b}
#scene{position:absolute;inset:0}
#scene canvas{display:block;width:100%;height:100%;touch-action:none}
.info{position:absolute;top:15px;left:15px;background:#20283acc;padding:10px 13px;border-radius:8px;font-size:12px;pointer-events:none;line-height:1.5}
.bottom{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:#20283acc;padding:10px 14px;border-radius:20px;font-size:11px;white-space:nowrap;pointer-events:none}
@media(max-width:650px){
 main{grid-template-columns:1fr;grid-template-rows:auto 1fr}
 aside{border-right:0;border-bottom:1px solid #30384b;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
 aside h3{grid-column:1/-1;margin:4px}
 .viewer{min-height:60vh}
 label{margin:8px 0}
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>
<header>
<h2>⚡ ESTÚDIO 3D</h2>
<span class="status" id="status">● Preparando ambiente 3D…</span>
</header>

<main>
<aside>
<h3>Ferramentas</h3>

<div>
<label>Câmera</label>
<button id="zoomIn">＋ Aproximar</button>
<button id="zoomOut">－ Afastar</button>
<button id="reset">↺ Reiniciar visão</button>
</div>

<div>
<label>Iluminação</label>
<input id="light" type="range" min="0" max="5" step=".1" value="2.5">
<label>Cor da luz</label>
<input id="lightColor" type="color" value="#ffffff">
</div>

<div>
<label>Modelo 3D</label>
<label class="upload" for="modelFile">＋ Importar modelo</label>
<input id="modelFile" type="file" accept=".glb,.gltf">
</div>

<div>
<label>Animação</label>
<button id="rotate">Girar modelo: ligado</button>
</div>
</aside>

<section class="viewer">
<div id="scene"></div>
<div class="info">
VISUALIZADOR 3D<br>
<span id="modelStatus">Carregando personagem…</span>
</div>
<div class="bottom">Arraste para girar • Use dois dedos para aproximar</div>
</section>
</main>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const mount = document.querySelector('#scene');
const status = document.querySelector('#status');
const modelStatus = document.querySelector('#modelStatus');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10131b);

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
const defaultCamera = new THREE.Vector3(0, 1.2, 7);
camera.position.copy(defaultCamera);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: false
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1;

mount.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x303044, 1.7));

const light = new THREE.DirectionalLight(0xffffff, 2.5);
light.position.set(4, 6, 5);
light.castShadow = true;
scene.add(light);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 30),
  new THREE.MeshStandardMaterial({
    color: 0x202637,
    roughness: 0.9
  })
);

floor.rotation.x = -Math.PI / 2;
floor.position.y = -1.5;
floor.receiveShadow = true;
scene.add(floor);

const grid = new THREE.GridHelper(20, 40, 0x58678d, 0x30394f);
grid.position.y = -1.49;
scene.add(grid);

const modelRoot = new THREE.Group();
scene.add(modelRoot);

const loader = new GLTFLoader();

let currentModel = null;
let rotating = true;
let dragging = false;
let lastX = 0;
let lastY = 0;
let spin = 0;
let touchDistance = 0;
let currentObjectUrl = null;

function frameModel(object) {
  const box = new THREE.Box3().setFromObject(object);

  if (box.isEmpty()) return;

  const size = box.getSize(new THREE.Vector3());
  const maxDimension = Math.max(size.x, size.y, size.z);

  if (!Number.isFinite(maxDimension) || maxDimension <= 0) return;

  const scale = 3.2 / maxDimension;
  object.scale.setScalar(scale);

  const scaledBox = new THREE.Box3().setFromObject(object);
  const scaledCenter = scaledBox.getCenter(new THREE.Vector3());

  object.position.x -= scaledCenter.x;
  object.position.z -= scaledCenter.z;
  object.position.y += -1.5 - scaledBox.min.y;

  camera.position.copy(defaultCamera);
  camera.lookAt(0, 0, 0);

  spin = 0;
  modelRoot.rotation.set(0, 0, 0);
}

function showModel(gltf, label) {
  if (currentModel) {
    modelRoot.remove(currentModel);
  }

  currentModel = gltf.scene;

  currentModel.traverse(item => {
    if (item.isMesh) {
      item.castShadow = true;
      item.receiveShadow = true;

      if (item.material) {
        const materials = Array.isArray(item.material)
          ? item.material
          : [item.material];

        materials.forEach(material => {
          material.needsUpdate = true;
        });
      }
    }
  });

  modelRoot.add(currentModel);
  frameModel(currentModel);

  modelStatus.textContent = label;
  status.textContent = '● Modelo 3D carregado';
}

function loadDefaultCharacter() {
  status.textContent = '● Carregando personagem…';

  loader.load(
    './man-base-character-rigged.glb',

    gltf => {
      showModel(gltf, 'Personagem humano carregado');
    },

    event => {
      if (event.total) {
        const percent = Math.round(
          event.loaded / event.total * 100
        );

        status.textContent = '● Carregando personagem ' + percent + '%';
      }
    },

    error => {
      console.error('Falha ao carregar personagem:', error);

      modelStatus.textContent =
        'Não foi possível carregar o personagem padrão';

      status.textContent = '● Falha ao carregar modelo';
    }
  );
}

loadDefaultCharacter();

// CONTROLE DA CÂMERA

renderer.domElement.addEventListener('pointerdown', event => {
  dragging = true;
  lastX = event.clientX;
  lastY = event.clientY;

  renderer.domElement.setPointerCapture(event.pointerId);
});

renderer.domElement.addEventListener('pointermove', event => {
  if (!dragging) return;

  spin += (event.clientX - lastX) * 0.01;
  modelRoot.rotation.y = spin;

  camera.position.y = Math.max(
    -1,
    Math.min(
      4,
      camera.position.y + (event.clientY - lastY) * 0.01
    )
  );

  camera.lookAt(0, 0, 0);

  lastX = event.clientX;
  lastY = event.clientY;
});

function stopDragging() {
  dragging = false;
}

renderer.domElement.addEventListener('pointerup', stopDragging);
renderer.domElement.addEventListener('pointercancel', stopDragging);

renderer.domElement.addEventListener('touchmove', event => {
  if (event.touches.length !== 2) return;

  const dx = event.touches[0].clientX - event.touches[1].clientX;
  const dy = event.touches[0].clientY - event.touches[1].clientY;

  const distance = Math.hypot(dx, dy);

  if (touchDistance) {
    camera.position.z = THREE.MathUtils.clamp(
      camera.position.z + (touchDistance - distance) * 0.015,
      3,
      12
    );
  }

  touchDistance = distance;
}, { passive: true });

renderer.domElement.addEventListener('touchend', () => {
  touchDistance = 0;
});

// BOTÕES

document.querySelector('#zoomIn').onclick = () => {
  camera.position.z = Math.max(3, camera.position.z - 0.6);
};

document.querySelector('#zoomOut').onclick = () => {
  camera.position.z = Math.min(12, camera.position.z + 0.6);
};

document.querySelector('#reset').onclick = () => {
  camera.position.copy(defaultCamera);
  camera.lookAt(0, 0, 0);

  spin = 0;
  modelRoot.rotation.set(0, 0, 0);
};

document.querySelector('#light').oninput = event => {
  light.intensity = Number(event.target.value);
};

document.querySelector('#lightColor').oninput = event => {
  light.color.set(event.target.value);
};

document.querySelector('#rotate').onclick = event => {
  rotating = !rotating;

  event.target.textContent = rotating
    ? 'Girar modelo: ligado'
    : 'Girar modelo: desligado';
};

// IMPORTAÇÃO DE MODELOS

document.querySelector('#modelFile').onchange = event => {
  const file = event.target.files && event.target.files[0];

  if (!file) return;

  if (currentObjectUrl) {
    URL.revokeObjectURL(currentObjectUrl);
  }

  currentObjectUrl = URL.createObjectURL(file);

  loader.load(
    currentObjectUrl,

    gltf => {
      showModel(gltf, 'Modelo importado: ' + file.name);

      if (currentObjectUrl) {
        URL.revokeObjectURL(currentObjectUrl);
      }

      currentObjectUrl = null;
    },

    undefined,

    error => {
      console.error('Falha ao importar modelo:', error);

      alert(
        'Não foi possível abrir esse modelo. Confira se o arquivo é GLB ou GLTF válido.'
      );

      if (currentObjectUrl) {
        URL.revokeObjectURL(currentObjectUrl);
      }

      currentObjectUrl = null;
    }
  );
};

// REDIMENSIONAMENTO

function resize() {
  const width = mount.clientWidth;
  const height = mount.clientHeight;

  if (!width || !height) return;

  camera.aspect = width / height;
  camera.updateProjectionMatrix();

  renderer.setSize(width, height);
}

const resizeObserver = new ResizeObserver(resize);
resizeObserver.observe(mount);

window.addEventListener('orientationchange', resize);
resize();

// ANIMAÇÃO DE VISUALIZAÇÃO

function animate() {
  requestAnimationFrame(animate);

  if (rotating && currentModel && !dragging) {
    modelRoot.rotation.y += 0.003;
  }

  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
