
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estúdio 3D — Teste</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#10131b;
  color:white;
  font-family:Arial,sans-serif;
}

header{
  min-height:60px;
  background:#191e2b;
  border-bottom:1px solid #30384b;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 16px;
  gap:10px;
}

header h2{font-size:19px;margin:0}

.status{
  font-size:11px;
  color:#62e6a5;
  text-align:right;
}

main{
  display:grid;
  grid-template-columns:220px 1fr;
  min-height:calc(100vh - 60px);
}

aside{
  background:#191e2b;
  padding:16px;
  border-right:1px solid #30384b;
}

h3{
  font-size:13px;
  color:#9eacc8;
  text-transform:uppercase;
  margin:8px 0 16px;
}

label{
  display:block;
  font-size:13px;
  margin:18px 0 8px;
}

input,button{width:100%}

input[type=range]{accent-color:#6685ff}

button,.upload{
  display:block;
  background:#29334a;
  color:white;
  border:1px solid #465575;
  border-radius:8px;
  padding:11px;
  margin:5px 0;
  font-size:13px;
  cursor:pointer;
  text-align:center;
}

button:active{background:#526bff}

.upload{display:block}

input[type=file]{display:none}

.viewer{
  position:relative;
  min-width:0;
  min-height:500px;
  background:#10131b;
  overflow:hidden;
}

#scene{
  position:absolute;
  inset:0;
}

#scene canvas{
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
}

.info{
  position:absolute;
  top:12px;
  left:12px;
  background:#20283acc;
  padding:10px 13px;
  border-radius:8px;
  font-size:12px;
  pointer-events:none;
  line-height:1.5;
}

.bottom{
  position:absolute;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  background:#20283acc;
  padding:10px 14px;
  border-radius:20px;
  font-size:11px;
  white-space:nowrap;
  pointer-events:none;
}

@media(max-width:650px){
  main{
    display:flex;
    flex-direction:column;
    min-height:calc(100svh - 60px);
  }

  aside{
    display:flex;
    flex-wrap:nowrap;
    overflow-x:auto;
    gap:10px;
    padding:10px;
    border-right:0;
    border-bottom:1px solid #30384b;
  }

  aside h3{display:none}

  aside>div{
    flex:0 0 150px;
    min-width:150px;
  }

  .viewer{
    position:relative;
    min-height:calc(100svh - 210px);
    flex:1;
  }

  label{margin:8px 0}
}
</style>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<header>
  <h2>⚡ ESTÚDIO 3D</h2>
  <span class="status" id="status">● Preparando ambiente 3D…</span>
</header>

<main>

<aside>
  <h3>Ferramentas</h3>

  <div>
    <label>Câmera</label>
    <button id="zoomIn">＋ Aproximar</button>
    <button id="zoomOut">－ Diminuir zoom</button>
    <button id="reset">↺ Reiniciar visão</button>
  </div>

  <div>
    <label>Iluminação</label>
    <input id="light" type="range" min="0" max="5" step=".1" value="2.5">

    <label>Cor da luz</label>
    <input id="lightColor" type="color" value="#ffffff">
  </div>

  <div>
    <label>Modelo 3D</label>
    <label class="upload" for="modelFile">＋ Importar modelo</label>
    <input id="modelFile" type="file" accept=".glb,.gltf">
  </div>

  <div>
    <label>Animação</label>
    <button id="rotate">Girar modelo: ligado</button>
  </div>
</aside>

<section class="viewer">
  <div id="scene"></div>

  <div class="info">
    VISUALIZADOR 3D<br>
    <span id="modelStatus">Carregando personagem…</span>
  </div>

  <div class="bottom">
    Arraste para girar • Use dois dedos para zoom
  </div>
</section>

</main>

<script type="module">

import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const mount = document.querySelector('#scene');
const status = document.querySelector('#status');
const modelStatus = document.querySelector('#modelStatus');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10131b);

// CÂMERA

const camera = new THREE.PerspectiveCamera(35,1,0.01,1000);

let cameraDistance = 10;
let initialCameraDistance = 10;
let cameraTarget = new THREE.Vector3(0,0,0);
let minZoom = 2;
const maxZoom = 60;

function updateCamera(){
  camera.position.set(
    cameraTarget.x,
    cameraTarget.y,
    cameraTarget.z + cameraDistance
  );

  camera.lookAt(cameraTarget);
}

// RENDERIZADOR

const renderer = new THREE.WebGLRenderer({
  antialias:true,
  alpha:false
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1;

mount.appendChild(renderer.domElement);

// LUZES

scene.add(new THREE.HemisphereLight(
  0xffffff,
  0x303044,
  1.7
));

const light = new THREE.DirectionalLight(0xffffff,2.5);
light.position.set(4,6,5);
light.castShadow = true;
scene.add(light);

// CHÃO

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(100,100),
  new THREE.MeshStandardMaterial({
    color:0x202637,
    roughness:0.9
  })
);

floor.rotation.x = -Math.PI/2;
floor.position.y = -1.5;
floor.receiveShadow = true;
scene.add(floor);

const grid = new THREE.GridHelper(
  30,60,0x58678d,0x30394f
);

grid.position.y = -1.49;
scene.add(grid);

// GRUPO DO PERSONAGEM

const modelRoot = new THREE.Group();
scene.add(modelRoot);

const loader = new GLTFLoader();

let currentModel = null;
let mixer = null;
let rotating = true;
let dragging = false;
let lastX = 0;
let lastY = 0;
let spin = 0;
let touchDistance = 0;
let currentObjectUrl = null;
let clock = new THREE.Clock();

let modelHeight = 0;
let modelWidth = 0;
let modelDepth = 0;

// CALCULAR ENQUADRAMENTO AUTOMATICAMENTE

function fitCharacter(){

  if(!currentModel) return;

  const box = new THREE.Box3().setFromObject(currentModel);

  if(box.isEmpty()) return;

  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());

  modelHeight = size.y;
  modelWidth = size.x;
  modelDepth = size.z;

  // A câmera olha para o centro vertical do personagem
  cameraTarget.set(center.x,center.y,center.z);

  const verticalFov = THREE.MathUtils.degToRad(camera.fov);

  const horizontalFov = 2*Math.atan(
    Math.tan(verticalFov/2)*camera.aspect
  );

  // Distância necessária para caber altura e largura
  const distanceHeight =
    (modelHeight/2)/Math.tan(verticalFov/2);

  const distanceWidth =
    (modelWidth/2)/Math.tan(horizontalFov/2);

  // Margem extra para não cortar cabeça ou pés
  const requiredDistance = Math.max(
    distanceHeight,
    distanceWidth
  ) + modelDepth/2;

  initialCameraDistance = Math.max(
    3,
    requiredDistance*1.35
  );

  cameraDistance = initialCameraDistance;

  // Permite afastar bastante
  minZoom = Math.max(1,requiredDistance*0.45);

  updateCamera();
}

// CARREGAR MODELO

function showModel(gltf,label){

  if(currentModel){
    modelRoot.remove(currentModel);
  }

  if(mixer){
    mixer.stopAllAction();
    mixer = null;
  }

  currentModel = gltf.scene;

  currentModel.traverse(item=>{

    if(item.isMesh){
      item.castShadow = true;
      item.receiveShadow = true;

      if(item.material){
        const materials = Array.isArray(item.material)
          ? item.material
          : [item.material];

        materials.forEach(material=>{
          material.needsUpdate = true;
        });
      }
    }
  });

  modelRoot.add(currentModel);

  // Calcula o tamanho real antes de posicionar a câmera
  const originalBox = new THREE.Box3().setFromObject(currentModel);

  if(!originalBox.isEmpty()){

    const originalSize = originalBox.getSize(new THREE.Vector3());

    const largest = Math.max(
      originalSize.x,
      originalSize.y,
      originalSize.z
    );

    if(largest>0){
      currentModel.scale.setScalar(3.2/largest);
    }

    const scaledBox = new THREE.Box3().setFromObject(currentModel);
    const scaledSize = scaledBox.getSize(new THREE.Vector3());

    // Centraliza horizontalmente e apoia os pés no chão
    currentModel.position.x -= scaledBox.getCenter(new THREE.Vector3()).x;
    currentModel.position.z -= scaledBox.getCenter(new THREE.Vector3()).z;
    currentModel.position.y += -1.5-scaledBox.min.y;

    // Guarda dimensões após a escala
    modelHeight = scaledSize.y;
  }

  modelRoot.rotation.set(0,0,0);
  spin = 0;

  if(gltf.animations && gltf.animations.length){

    mixer = new THREE.AnimationMixer(currentModel);

    gltf.animations.forEach(animation=>{
      mixer.clipAction(animation).play();
    });
  }

  fitCharacter();

  modelStatus.textContent = label;
  status.textContent = '● Modelo 3D carregado';
}

// PERSONAGEM PADRÃO

function loadDefaultCharacter(){

  status.textContent = '● Carregando personagem…';

  loader.load(
    './man-base-character-rigged.glb',

    gltf=>{
      showModel(gltf,'Personagem humano carregado');
    },

    event=>{
      if(event.total){
        const percent = Math.round(event.loaded/event.total*100);
        status.textContent = '● Carregando '+percent+'%';
      }
    },

    error=>{
      console.error(error);
      modelStatus.textContent = 'Erro ao carregar personagem';
      status.textContent = '● Falha ao carregar modelo';
    }
  );
}

loadDefaultCharacter();

// ARRASTAR PARA GIRAR

renderer.domElement.addEventListener('pointerdown',event=>{

  if(event.pointerType==='touch' && event.isPrimary===false) return;

  dragging = true;
  lastX = event.clientX;
  lastY = event.clientY;

  renderer.domElement.setPointerCapture(event.pointerId);
});

renderer.domElement.addEventListener('pointermove',event=>{

  if(!dragging) return;

  spin += (event.clientX-lastX)*0.01;
  modelRoot.rotation.y = spin;

  lastX = event.clientX;
  lastY = event.clientY;
});

function stopDragging(){
  dragging = false;
}

renderer.domElement.addEventListener('pointerup',stopDragging);
renderer.domElement.addEventListener('pointercancel',stopDragging);

// ZOOM COM DOIS DEDOS

renderer.domElement.addEventListener('touchmove',event=>{

  if(event.touches.length!==2) return;

  const dx = event.touches[0].clientX-event.touches[1].clientX;
  const dy = event.touches[0].clientY-event.touches[1].clientY;

  const distance = Math.hypot(dx,dy);

  if(touchDistance){

    cameraDistance = THREE.MathUtils.clamp(
      cameraDistance+(touchDistance-distance)*0.02,
      minZoom,
      maxZoom
    );

    updateCamera();
  }

  touchDistance = distance;

},{passive:true});

renderer.domElement.addEventListener('touchend',()=>{
  touchDistance = 0;
});

// APROXIMAR

document.querySelector('#zoomIn').onclick = ()=>{

  cameraDistance = Math.max(
    minZoom,
    cameraDistance-1
  );

  updateCamera();
};

// DIMINUIR ZOOM

document.querySelector('#zoomOut').onclick = ()=>{

  cameraDistance = Math.min(
    maxZoom,
    cameraDistance+2
  );

  updateCamera();
};

// REINICIAR CÂMERA

document.querySelector('#reset').onclick = ()=>{

  cameraDistance = initialCameraDistance;

  if(currentModel){
    fitCharacter();
  }else{
    updateCamera();
  }

  spin = 0;
  modelRoot.rotation.set(0,0,0);
};

// ILUMINAÇÃO

document.querySelector('#light').oninput = event=>{
  light.intensity = Number(event.target.value);
};

document.querySelector('#lightColor').oninput = event=>{
  light.color.set(event.target.value);
};

// ROTAÇÃO AUTOMÁTICA

document.querySelector('#rotate').onclick = event=>{

  rotating = !rotating;

  event.target.textContent = rotating
    ? 'Girar modelo: ligado'
    : 'Girar modelo: desligado';
};

// IMPORTAR MODELO

document.querySelector('#modelFile').onchange = event=>{

  const file = event.target.files && event.target.files[0];

  if(!file) return;

  if(currentObjectUrl){
    URL.revokeObjectURL(currentObjectUrl);
  }

  currentObjectUrl = URL.createObjectURL(file);

  status.textContent = '● Importando modelo…';

  loader.load(
    currentObjectUrl,

    gltf=>{

      showModel(gltf,'Modelo importado: '+file.name);

      URL.revokeObjectURL(currentObjectUrl);
      currentObjectUrl = null;
    },

    undefined,

    error=>{

      console.error(error);

      alert('Não foi possível abrir esse modelo. Confira se é um arquivo GLB ou GLTF válido.');

      status.textContent = '● Erro ao importar modelo';

      if(currentObjectUrl){
        URL.revokeObjectURL(currentObjectUrl);
      }

      currentObjectUrl = null;
    }
  );
};

// REDIMENSIONAR TELA

function resize(){

  const width = mount.clientWidth;
  const height = mount.clientHeight;

  if(!width || !height) return;

  camera.aspect = width/height;
  camera.updateProjectionMatrix();

  renderer.setSize(width,height);

  // Recalcula o enquadramento quando muda a tela
  if(currentModel){
    fitCharacter();
  }
}

const resizeObserver = new ResizeObserver(resize);
resizeObserver.observe(mount);

window.addEventListener('orientationchange',resize);

resize();

// ANIMAÇÃO

function animate(){

  requestAnimationFrame(animate);

  const delta = clock.getDelta();

  if(mixer){
    mixer.update(delta);
  }

  if(rotating && currentModel && !dragging){
    modelRoot.rotation.y += 0.003;
  }

  renderer.render(scene,camera);
}

animate();

</script>
</body>
</html>
