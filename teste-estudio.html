
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estúdio 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10131b;color:#fff;font-family:Arial,sans-serif}
header{height:60px;background:#191e2b;border-bottom:1px solid #30384b;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
header h2{font-size:19px;margin:0}
.status{font-size:11px;color:#62e6a5}
main{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 60px)}
aside{background:#191e2b;padding:16px;border-right:1px solid #30384b}
h3{font-size:13px;color:#9eacc8;text-transform:uppercase;margin:8px 0 16px}
label{display:block;font-size:13px;margin:18px 0 8px}
input,button{width:100%}
input[type=range]{accent-color:#6685ff}
button,.upload{background:#29334a;color:white;border:1px solid #465575;border-radius:8px;padding:11px;margin:5px 0;font-size:13px;cursor:pointer;text-align:center}
button:active{background:#526bff}
.upload{display:block}
input[type=file]{display:none}
.viewer{position:relative;min-width:0;min-height:500px;background:#10131b}
#scene{position:absolute;inset:0}
.info{position:absolute;top:15px;left:15px;background:#20283acc;padding:10px 13px;border-radius:8px;font-size:12px;pointer-events:none}
.bottom{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:#20283acc;padding:10px 14px;border-radius:20px;font-size:11px;white-space:nowrap;pointer-events:none}
@media(max-width:650px){
 main{grid-template-columns:1fr;grid-template-rows:auto 1fr}
 aside{border-right:0;border-bottom:1px solid #30384b;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
 aside h3{grid-column:1/-1;margin:4px}
 .viewer{min-height:60vh}
 label{margin:8px 0}
}
</style>
</head>
<body>

<header>
<h2>⚡ ESTÚDIO 3D</h2>
<span class="status">● Ambiente de teste</span>
</header>

<main>
<aside>
<h3>Ferramentas</h3>

<div>
<label>Câmera</label>
<button id="zoomIn">＋ Aproximar</button>
<button id="zoomOut">－ Afastar</button>
<button id="reset">↺ Reiniciar visão</button>
</div>

<div>
<label>Iluminação</label>
<input id="light" type="range" min="0" max="5" step=".1" value="2.5">
<label>Cor da luz</label>
<input id="lightColor" type="color" value="#ffffff">
</div>

<div>
<label>Modelo 3D</label>
<label class="upload" for="modelFile">＋ Importar modelo</label>
<input id="modelFile" type="file" accept=".glb,.gltf">
</div>

<div>
<label>Animação</label>
<button id="rotate">Girar modelo: ligado</button>
</div>
</aside>

<section class="viewer">
<div id="scene"></div>
<div class="info">VISUALIZADOR 3D<br>Área de trabalho</div>
<div class="bottom">Arraste para girar • Use dois dedos para aproximar</div>
</section>
</main>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

const mount=document.querySelector('#scene');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x10131b);

const camera=new THREE.PerspectiveCamera(45,1,.1,100);
camera.position.set(0,2,7);
camera.lookAt(0,0,0);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
mount.appendChild(renderer.domElement);

const ambient=new THREE.HemisphereLight(0xffffff,0x303044,1.5);
scene.add(ambient);

const light=new THREE.DirectionalLight(0xffffff,2.5);
light.position.set(4,6,5);
light.castShadow=true;
scene.add(light);

const floor=new THREE.Mesh(
new THREE.PlaneGeometry(30,30),
new THREE.MeshStandardMaterial({color:0x202637})
);
floor.rotation.x=-Math.PI/2;
floor.position.y=-1.5;
floor.receiveShadow=true;
scene.add(floor);

const grid=new THREE.GridHelper(20,40,0x58678d,0x30394f);
grid.position.y=-1.49;
scene.add(grid);

const model=new THREE.Group();
scene.add(model);

const blue=new THREE.MeshStandardMaterial({color:0x527cff});
const dark=new THREE.MeshStandardMaterial({color:0x20283c});
const skin=new THREE.MeshStandardMaterial({color:0xf0bd98});

function sphere(parent,material,x,y,z,sx,sy,sz){
const obj=new THREE.Mesh(new THREE.SphereGeometry(1,32,24),material);
obj.position.set(x,y,z);
obj.scale.set(sx,sy,sz);
obj.castShadow=true;
obj.receiveShadow=true;
parent.add(obj);
return obj;
}

sphere(model,dark,0,-.45,0,.55,.7,.35);
sphere(model,blue,0,-.4,.2,.48,.6,.25);
sphere(model,skin,0,.55,0,.42,.45,.4);
sphere(model,dark,0,.95,0,.43,.16,.4);
sphere(model,blue,-.55,-.3,0,.13,.55,.14);
sphere(model,blue,.55,-.3,0,.13,.55,.14);
sphere(model,dark,-.23,-1.1,0,.17,.4,.17);
sphere(model,dark,.23,-1.1,0,.17,.4,.17);

let rotating=true;
let dragging=false;
let lastX=0;
let lastY=0;
let spin=0;
let touchDistance=0;

renderer.domElement.style.touchAction='none';

renderer.domElement.addEventListener('pointerdown',e=>{
dragging=true;
lastX=e.clientX;
lastY=e.clientY;
renderer.domElement.setPointerCapture(e.pointerId);
});

renderer.domElement.addEventListener('pointermove',e=>{
if(!dragging)return;
spin+=(e.clientX-lastX)*.01;
model.rotation.y=spin;
camera.position.y=Math.max(-1,Math.min(4,camera.position.y+(e.clientY-lastY)*.01));
camera.lookAt(0,0,0);
lastX=e.clientX;
lastY=e.clientY;
});

renderer.domElement.addEventListener('pointerup',()=>dragging=false);
renderer.domElement.addEventListener('pointercancel',()=>dragging=false);

renderer.domElement.addEventListener('touchmove',e=>{
if(e.touches.length!==2)return;
const dx=e.touches[0].clientX-e.touches[1].clientX;
const dy=e.touches[0].clientY-e.touches[1].clientY;
const distance=Math.hypot(dx,dy);
if(touchDistance){
camera.position.z=Math.max(3,Math.min(12,camera.position.z+(touchDistance-distance)*.015));
}
touchDistance=distance;
},{passive:true});

renderer.domElement.addEventListener('touchend',()=>touchDistance=0);

document.querySelector('#zoomIn').onclick=()=>{
camera.position.z=Math.max(3,camera.position.z-.6);
};
document.querySelector('#zoomOut').onclick=()=>{
camera.position.z=Math.min(12,camera.position.z+.6);
};
document.querySelector('#reset').onclick=()=>{
camera.position.set(0,2,7);
camera.lookAt(0,0,0);
spin=0;
model.rotation.set(0,0,0);
};

document.querySelector('#light').oninput=e=>{
light.intensity=Number(e.target.value);
};

document.querySelector('#lightColor').oninput=e=>{
light.color.set(e.target.value);
};

document.querySelector('#rotate').onclick=e=>{
rotating=!rotating;
e.target.textContent=rotating?'Girar modelo: ligado':'Girar modelo: desligado';
};

let importedModel=null;
const loader=new GLTFLoader();

document.querySelector('#modelFile').onchange=e=>{
const file=e.target.files[0];
if(!file)return;

const url=URL.createObjectURL(file);

loader.load(url,gltf=>{
if(importedModel)scene.remove(importedModel);
importedModel=gltf.scene;
scene.add(importedModel);
model.visible=false;
URL.revokeObjectURL(url);
},undefined,error=>{
console.error(error);
alert('Não foi possível abrir esse modelo.');
URL.revokeObjectURL(url);
});
};

function resize(){
const width=mount.clientWidth;
const height=mount.clientHeight;
if(!width||!height)return;
camera.aspect=width/height;
camera.updateProjectionMatrix();
renderer.setSize(width,height);
}
new ResizeObserver(resize).observe(mount);
resize();

function animate(){
requestAnimationFrame(animate);
if(rotating)model.rotation.y+=.003;
renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
